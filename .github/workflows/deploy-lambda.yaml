name: Deploy to Lambda (ECR)

on:
  push:
    branches: [ "develop", "main" ]

  workflow_dispatch:
    inputs:
      target_env:
        description: "Manual deployment target"
        required: true
        type: choice
        options:
          - staging

# OIDC 인증을 위한 권한 설정
permissions:
  id-token: write
  contents: read

jobs:
  resolve:
    name: Resolve deployment target
    runs-on: ubuntu-latest

    outputs:
      env_type: ${{ steps.resolve.outputs.env_type }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}

    steps:
      - name: Resolve target environment
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ENV_TYPE="${{ github.event.inputs.target_env }}"

            if [[ "$ENV_TYPE" != "staging" ]]; then
              echo "Only staging manual deployment is allowed."
              exit 1
            fi

            GITHUB_ENVIRONMENT="STAGING"
          else
            case "${GITHUB_REF_NAME}" in
              develop)
                ENV_TYPE="dev"
                GITHUB_ENVIRONMENT="DEV"
                ;;
              main)
                ENV_TYPE="prod"
                GITHUB_ENVIRONMENT="PROD"
                ;;
              *)
                echo "Unsupported branch for push deployment: ${GITHUB_REF_NAME}"
                exit 1
                ;;
            esac
          fi

          echo "env_type=$ENV_TYPE" >> "$GITHUB_OUTPUT"
          echo "github_environment=$GITHUB_ENVIRONMENT" >> "$GITHUB_OUTPUT"

          echo "--- Event: ${GITHUB_EVENT_NAME}"
          echo "--- Branch: ${GITHUB_REF_NAME}"
          echo "--- Env type: $ENV_TYPE"
          echo "--- GitHub environment: $GITHUB_ENVIRONMENT"

  deploy:
    name: Build, Push to ECR, and Deploy to Lambda
    needs: resolve
    runs-on: ubuntu-latest

    # 브랜치에 따라 사용할 환경 선택
    environment: ${{ needs.resolve.outputs.github_environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker 이미지 빌드 및 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --provenance=false -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Lambda 함수 존재 여부 확인
      - name: Check if Lambda function exists
        id: check-lambda
        shell: bash
        run: |
          set +e
          RESULT=$(aws lambda get-function \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" 2>&1)
          STATUS=$?
          set -e

          if [[ $STATUS -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RESULT" == *"ResourceNotFoundException"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$RESULT"
            exit $STATUS
          fi

      # 기존 Lambda 함수 코드 업데이트
      - name: Update existing Lambda function code
        if: steps.check-lambda.outputs.exists == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ steps.build-image.outputs.image_uri }}"

      # 코드 업데이트가 완료될 때까지 대기
      - name: Wait for Lambda function update to complete
        if: steps.check-lambda.outputs.exists == 'true'
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}

      # 기존 Lambda 함수의 실행 역할 및 환경 변수 업데이트
      - name: Update existing Lambda function configuration
        if: steps.check-lambda.outputs.exists == 'true'
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --role "${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}" \
            --environment "Variables={ \
              REGION_NAME=${{ vars.AWS_REGION }}, \
              LAMBDA_FUNCTION_NAME=${{ vars.LAMBDA_FUNCTION_NAME }}, \
              ECR_REPOSITORY_NAME=${{ vars.ECR_REPOSITORY_NAME }}, \
              BUCKET_NAME=${{ vars.BUCKET_NAME }}, \
              THUMBNAIL_BUCKET=${{ vars.THUMBNAIL_BUCKET }} \
            }"

      # Lambda 함수가 없으면 신규 생성
      - name: Create Lambda function
        if: steps.check-lambda.outputs.exists == 'false'
        run: |
          aws lambda create-function \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --package-type Image \
            --code "ImageUri=${{ steps.build-image.outputs.image_uri }}" \
            --role "${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}" \
            --environment "Variables={ \
              REGION_NAME=${{ vars.AWS_REGION }}, \
              LAMBDA_FUNCTION_NAME=${{ vars.LAMBDA_FUNCTION_NAME }}, \
              ECR_REPOSITORY_NAME=${{ vars.ECR_REPOSITORY_NAME }}, \
              BUCKET_NAME=${{ vars.BUCKET_NAME }}, \
              THUMBNAIL_BUCKET=${{ vars.THUMBNAIL_BUCKET }} \
            }"

      # 기존 Lambda 설정 업데이트가 완료될 때까지 대기
      - name: Wait for Lambda configuration update to complete
        if: steps.check-lambda.outputs.exists == 'true'
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}

      # 신규 Lambda 함수가 Active 상태가 될 때까지 대기
      - name: Wait for new Lambda function to become active
        if: steps.check-lambda.outputs.exists == 'false'
        run: |
          aws lambda wait function-active-v2 \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}

      - name: Summarize deployment metadata
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.github_environment }}
        run: |
          {
            echo "## Deployment Metadata"
            echo ""
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Environment: $DEPLOY_ENVIRONMENT"
            echo "- ECR Repository: ${{ vars.ECR_REPOSITORY_NAME }}"
            echo "- Lambda Function: ${{ vars.LAMBDA_FUNCTION_NAME }}"
          } >> "$GITHUB_STEP_SUMMARY"
